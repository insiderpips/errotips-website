<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Errotips CRM</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #08060f;
    color: #f4f0ff;
    min-height: 100vh;
  }
  a { color: #38bdf8; }

  /* ---- login screen ---- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: #120a1f;
    border: 1px solid #2a1d3d;
    border-radius: 16px;
    padding: 32px;
    text-align: center;
  }
  .login-card h1 {
    font-size: 20px;
    margin: 0 0 20px;
    background: linear-gradient(135deg, #0ea5e9, #a855f7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .login-card input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a1d3d;
    background: #08060f;
    color: #f4f0ff;
    font-size: 15px;
    margin-bottom: 14px;
    outline: none;
  }
  .login-card input:focus { border-color: #38bdf8; }
  .btn {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #0ea5e9, #a855f7);
    color: #0f0b1a;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .btn:hover { opacity: 0.9; }
  .error-msg {
    color: #f87171;
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
  }

  /* ---- dashboard ---- */
  #dashboard { display: none; padding: 24px; max-width: 1400px; margin: 0 auto; }
  .header {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 22px;
    margin: 0;
    color: #38bdf8;
  }
  .header .count {
    color: #9b8ab5;
    font-size: 14px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  #search {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #2a1d3d;
    background: #120a1f;
    color: #f4f0ff;
    font-size: 14px;
    outline: none;
  }
  #search:focus { border-color: #38bdf8; }
  .btn-secondary {
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid #2a1d3d;
    background: #120a1f;
    color: #c0b4d8;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-secondary:hover { border-color: #38bdf8; color: #38bdf8; }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid #2a1d3d;
    border-radius: 14px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td {
    padding: 12px 14px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid #1c1428;
  }
  th {
    background: #120a1f;
    color: #9b8ab5;
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  tr:hover td { background: #100a1c; }
  td.message-cell, td.email-cell { white-space: normal; max-width: 260px; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.new { background: rgba(56,189,248,0.15); color: #38bdf8; }
  .badge.done { background: rgba(168,85,247,0.15); color: #a855f7; }
  input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: #38bdf8; }
  .loading, .empty { text-align: center; padding: 40px; color: #9b8ab5; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>Errotips CRM</h1>
    <input type="password" id="password-input" placeholder="Slaptažodis" autocomplete="current-password">
    <button class="btn" id="login-btn">Prisijungti</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<div id="dashboard">
  <div class="header">
    <h1>Leads</h1>
    <div class="count" id="lead-count"></div>
  </div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Ieškoti pagal vardą, el. paštą ar telefoną...">
    <button class="btn-secondary" id="export-btn">Eksportuoti CSV</button>
    <button class="btn-secondary" id="refresh-btn">Atnaujinti</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Vardas</th>
          <th>El. paštas</th>
          <th>Telefonas</th>
          <th>Žinutė</th>
          <th>Statusas</th>
        </tr>
      </thead>
      <tbody id="leads-body">
        <tr><td colspan="6" class="loading">Kraunama...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API_URL = "https://fsqtjmexsyockqsisuab.supabase.co/functions/v1/admin-leads";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzcXRqbWV4c3lvY2txc2lzdWFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0OTcwNjYsImV4cCI6MjA5ODA3MzA2Nn0.Rr__bULnyduV9emvu1qLkq9tTHvQ1opO2paybzZsbCg";

let allLeads = [];

const loginScreen = document.getElementById('login-screen');
const dashboard = document.getElementById('dashboard');
const passwordInput = document.getElementById('password-input');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');
const leadsBody = document.getElementById('leads-body');
const leadCount = document.getElementById('lead-count');
const searchInput = document.getElementById('search');
const exportBtn = document.getElementById('export-btn');
const refreshBtn = document.getElementById('refresh-btn');

function getPassword() {
  return sessionStorage.getItem('crm_admin_password');
}

async function fetchLeads(password) {
  const res = await fetch(API_URL, {
    method: 'GET',
    headers: {
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + ANON_KEY,
      'x-admin-password': password,
    },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || ('HTTP ' + res.status));
  }
  const body = await res.json();
  return body.leads || [];
}

async function updateContacted(id, contacted, password) {
  const res = await fetch(API_URL, {
    method: 'PATCH',
    headers: {
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + ANON_KEY,
      'x-admin-password': password,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ id, contacted }),
  });
  if (!res.ok) throw new Error('Nepavyko atnaujinti');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('lt-LT', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function renderLeads(leads) {
  if (leads.length === 0) {
    leadsBody.innerHTML = '<tr><td colspan="6" class="empty">Nieko nerasta</td></tr>';
    return;
  }
  leadsBody.innerHTML = leads.map(lead => `
    <tr data-id="${escapeHtml(lead.id)}">
      <td>${formatDate(lead.created_at)}</td>
      <td>${escapeHtml(lead.name)}</td>
      <td class="email-cell">${escapeHtml(lead.email)}</td>
      <td>${escapeHtml((lead.phone || '').trim())}</td>
      <td class="message-cell">${escapeHtml(lead.message || '')}</td>
      <td>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" class="contacted-checkbox" ${lead.contacted ? 'checked' : ''}>
          <span class="badge ${lead.contacted ? 'done' : 'new'}">${lead.contacted ? 'Susisiekta' : 'Naujas'}</span>
        </label>
      </td>
    </tr>
  `).join('');
}

function applyFilter() {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = !q ? allLeads : allLeads.filter(l =>
    (l.name || '').toLowerCase().includes(q) ||
    (l.email || '').toLowerCase().includes(q) ||
    (l.phone || '').toLowerCase().includes(q)
  );
  leadCount.textContent = filtered.length + ' iš ' + allLeads.length;
  renderLeads(filtered);
}

async function loadLeads() {
  const password = getPassword();
  leadsBody.innerHTML = '<tr><td colspan="6" class="loading">Kraunama...</td></tr>';
  try {
    allLeads = await fetchLeads(password);
    applyFilter();
  } catch (err) {
    leadsBody.innerHTML = '<tr><td colspan="6" class="empty">Klaida: ' + escapeHtml(err.message) + '</td></tr>';
  }
}

function showDashboard() {
  loginScreen.style.display = 'none';
  dashboard.style.display = 'block';
  loadLeads();
}

async function tryLogin(password) {
  loginError.textContent = '';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Jungiamasi...';
  try {
    await fetchLeads(password);
    sessionStorage.setItem('crm_admin_password', password);
    showDashboard();
  } catch (err) {
    loginError.textContent = 'Neteisingas slaptažodis arba klaida: ' + err.message;
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Prisijungti';
  }
}

loginBtn.addEventListener('click', () => {
  const pw = passwordInput.value.trim();
  if (pw) tryLogin(pw);
});
passwordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loginBtn.click();
});

searchInput.addEventListener('input', applyFilter);
refreshBtn.addEventListener('click', loadLeads);

exportBtn.addEventListener('click', () => {
  const q = searchInput.value.trim().toLowerCase();
  const rows = !q ? allLeads : allLeads.filter(l =>
    (l.name || '').toLowerCase().includes(q) ||
    (l.email || '').toLowerCase().includes(q) ||
    (l.phone || '').toLowerCase().includes(q)
  );
  const header = ['created_at', 'name', 'email', 'phone', 'message', 'contacted'];
  const csv = [header.join(';')].concat(
    rows.map(l => header.map(k => '"' + String(l[k] ?? '').replace(/"/g, '""') + '"').join(';'))
  ).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'leads-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
});

leadsBody.addEventListener('change', async (e) => {
  if (!e.target.classList.contains('contacted-checkbox')) return;
  const row = e.target.closest('tr');
  const id = row.dataset.id;
  const contacted = e.target.checked;
  const password = getPassword();
  const badge = row.querySelector('.badge');
  try {
    await updateContacted(id, contacted, password);
    badge.textContent = contacted ? 'Susisiekta' : 'Naujas';
    badge.className = 'badge ' + (contacted ? 'done' : 'new');
    const lead = allLeads.find(l => String(l.id) === String(id));
    if (lead) lead.contacted = contacted;
  } catch (err) {
    e.target.checked = !contacted;
    alert('Nepavyko atnaujinti: ' + err.message);
  }
});

// auto-login if password already stored in this session
const stored = getPassword();
if (stored) {
  fetchLeads(stored).then(leads => {
    allLeads = leads;
    showDashboard();
    applyFilter();
  }).catch(() => {
    sessionStorage.removeItem('crm_admin_password');
  });
}
</script>
</body>
</html>
